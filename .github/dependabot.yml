version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      timezone: America/Bogota
    open-pull-requests-limit: 5
    groups:
      next-react:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react*"]
      tooling:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Majors need a human: review release notes before upgrading.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
